name: Check website files
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files exist
        run: |
          test -s site/index.html
          test -s site/assets/app.js
          test -s site/data/questions.js
          test -s development/ROADMAP.md
          test -s site/assets/scheduler.js
      - name: Test random question cooldown
        run: node --test tests/*.test.mjs

      - name: Audit full question options and OCR artefacts
        run: node scripts/audit-question-bank.mjs
      - name: Preview next questions for sequential quality audit
        run: node scripts/audit-next-batch.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check site/assets/app.js
          node --check site/assets/scheduler.js
          node --check site/assets/voice-reader.js
          node --check site/assets/auto-next.js
          node --check site/assets/history.js
          node --check site/assets/review-bookmarks.js
          node --check site/assets/review-mix.js
          node --check site/assets/audit-dashboard.js
          node --check site/data/questions.js
